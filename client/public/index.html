<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Tassili ART - Plataforma de aplicaciones web progresivas" />
    
    <!-- ✅ MANIFEST CORREGIDO -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- ✅ APPLE META TAGS -->
    <link rel="apple-touch-icon" href="/logo192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Tassili ART" />
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    
    <!-- Iconos y Fuentes -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
    
    <title>Tassili ART</title>
  </head>
  <body>
    <noscript>Necesitas habilitar JavaScript para ejecutar esta app.</noscript>
    <div id="root"></div>

    <!-- ✅ SCRIPT DE REGISTRO DEL SERVICE WORKER MEJORADO -->
    <script>
      console.log('🚀 Iniciando registro de Service Worker...');
      
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          console.log('📱 Registrando Service Worker...');
          
          navigator.serviceWorker.register('/sw.js')
            .then(function(registration) {
              console.log('✅ ServiceWorker registrado correctamente: ', registration.scope);
              
              // Verificar actualizaciones
              registration.update();
              
              // Escuchar cambios en el Service Worker
              registration.addEventListener('updatefound', () => {
                console.log('🔄 Nuevo Service Worker encontrado');
              });
            })
            .catch(function(error) {
              console.log('❌ ServiceWorker registro falló: ', error);
              console.log('🔍 Error details:', error.message);
            });
        });
        
        // ✅ Escuchar mensajes del Service Worker
        navigator.serviceWorker.addEventListener('message', event => {
          console.log('📨 Mensaje del Service Worker:', event.data);
        });
      } else {
        console.log('❌ ServiceWorker no soportado en este navegador');
      }
      
      // ✅ Debug info
      console.log('🌐 PWA Debug Info:', {
        url: window.location.href,
        protocol: window.location.protocol,
        userAgent: navigator.userAgent,
        serviceWorker: 'serviceWorker' in navigator,
        standalone: window.matchMedia('(display-mode: standalone)').matches
      });
    </script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
